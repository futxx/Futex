    <style>
        :root {
            --bg-principal: #09090b;
            --bg-card: #14141d;
            --bg-card-hover: #1c1c28;
            --cor-primaria: #00ff88;
            --cor-primaria-glowing: rgba(0, 255, 136, 0.4);
            --cor-texto: #f4f4f5;
            --cor-texto-secundario: #a1a1aa;
            --borda: rgba(255, 255, 255, 0.08);
            --fonte: 'Plus Jakarta Sans', sans-serif;
            --glass-bg: rgba(20, 20, 29, 0.75);
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: var(--fonte);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-principal);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px 40px 15px;
            overflow-x: hidden;
        }

        .logo-container {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 20px; margin-top: 10px; user-select: none;
        }

        .logo-icon {
            width: 38px; height: 38px; fill: var(--cor-primaria);
            filter: drop-shadow(0 0 12px var(--cor-primaria-glowing));
        }

        .logo-text {
            font-size: 2.2rem; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            color: var(--cor-primaria); -webkit-text-fill-color: var(--cor-primaria);
            text-shadow: 0 0 15px var(--cor-primaria-glowing); font-weight: 900;
        }

        .main-nav {
            display: flex; gap: 8px; margin-bottom: 24px;
            background: var(--glass-bg); padding: 6px;
            border-radius: 16px; border: 1px solid var(--borda);
            backdrop-filter: blur(12px);
        }

        .main-nav-btn {
            background: transparent; color: var(--cor-texto-secundario);
            border: none; padding: 10px 22px; border-radius: 12px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease;
        }

        .main-nav-btn:hover { color: var(--cor-texto); }
        .main-nav-btn.active {
            background-color: var(--cor-primaria); color: #000;
            box-shadow: 0 0 20px var(--cor-primaria-glowing);
        }

        .filter-container {
            display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 900px;
            overflow-x: auto; padding-bottom: 8px; scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn {
            background-color: var(--bg-card); color: var(--cor-texto-secundario);
            border: 1px solid var(--borda); padding: 8px 18px; border-radius: 12px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; transition: all 0.25s ease;
        }
        .filter-btn:hover { background-color: var(--bg-card-hover); color: var(--cor-texto); }
        .filter-btn.active { border-color: var(--cor-primaria); background-color: rgba(0, 255, 136, 0.12); color: var(--cor-primaria); }

        .channels-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px; width: 100%; max-width: 900px;
        }

        .channel-card {
            background-color: var(--bg-card); border: 1px solid var(--borda);
            border-radius: 16px; padding: 10px; text-align: center; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; position: relative;
            overflow: hidden;
        }
        .channel-card:hover { transform: translateY(-6px); background-color: var(--bg-card-hover); border-color: rgba(255,255,255,0.2); }

        .badge {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.7);
            color: var(--cor-primaria); font-size: 0.65rem; font-weight: 800;
            padding: 3px 7px; border-radius: 6px; border: 1px solid rgba(0, 255, 136, 0.3);
            backdrop-filter: blur(4px); z-index: 2;
        }

        .channel-logo-wrapper {
            width: 100%; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden;
            background-color: #0d0d12; margin-bottom: 10px; position: relative;
        }

        .channel-logo { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .channel-card:hover .channel-logo { transform: scale(1.05); }
        .channel-name { font-size: 0.85rem; font-weight: 700; color: var(--cor-texto); line-height: 1.2; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 100%; }

        .movie-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center;
            z-index: 200; backdrop-filter: blur(12px); padding: 15px;
        }

        .movie-card-modal {
            background-color: #1e1e1e; border-radius: 18px; max-width: 520px; width: 100%;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border: 1px solid var(--borda);
            position: relative;
        }

        .movie-modal-banner {
            position: relative; height: 190px;
            background-size: cover; background-position: center;
        }

        .movie-modal-banner::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 10%, #1e1e1e 100%);
        }

        .close-modal-btn {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            background: rgba(0, 0, 0, 0.6); color: #fff; border: none;
            width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem;
            cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
        }

        .movie-modal-header {
            display: flex; gap: 16px; padding: 0 20px;
            margin-top: -70px; position: relative; z-index: 2;
        }

        .movie-modal-poster {
            width: 110px; aspect-ratio: 2/3; border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); flex-shrink: 0; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .movie-modal-info { display: flex; flex-direction: column; justify-content: flex-end; }
        .movie-modal-title { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
        .movie-modal-year { color: #aaa; font-weight: normal; }

        .rating-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background-color: #ff9800; color: #000; font-weight: 800;
            padding: 3px 8px; border-radius: 6px; margin-top: 8px; width: fit-content; font-size: 0.85rem;
        }

        .movie-modal-body { padding: 20px; }
        .movie-modal-meta { display: flex; flex-wrap: wrap; gap: 12px; color: #aaa; font-size: 0.85rem; margin-bottom: 20px; font-weight: 500; }

        .play-red-button {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; background-color: #e50914; color: white; border: none;
            padding: 14px; border-radius: 10px; font-weight: 800; font-size: 0.95rem;
            cursor: pointer; transition: background 0.2s ease; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .play-red-button:hover { background-color: #b80710; }

        .player-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center;
            z-index: 300; backdrop-filter: blur(15px); padding: 15px;
        }

        .player-modal-container {
            width: 100%; max-width: 900px; position: relative;
            background-color: #000; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 136, 0.1);
            border: 1px solid var(--borda);
        }

        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; background-color: #000; }

        .video-js .vjs-big-play-button {
            background-color: rgba(10, 10, 15, 0.85) !important;
            border: 2px solid var(--cor-primaria) !important;
            color: var(--cor-primaria) !important; width: 70px !important; height: 70px !important;
            border-radius: 50% !important; line-height: 66px !important;
            margin-top: -35px !important; margin-left: -35px !important;
            box-shadow: 0 0 20px var(--cor-primaria-glowing) !important;
            backdrop-filter: blur(4px);
        }

        .video-js .vjs-play-progress { background-color: var(--cor-primaria) !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center;
            z-index: 400; backdrop-filter: blur(10px);
        }

        .modal {
            background-color: var(--bg-card); border: 1px solid var(--borda);
            border-radius: 20px; padding: 25px; width: 90%; max-width: 480px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }

        .modal h3 { font-weight: 800; font-size: 1.2rem; }
        .modal input, .modal select {
            background-color: var(--bg-principal); border: 1px solid var(--borda);
            color: var(--cor-texto); padding: 12px; border-radius: 12px; outline: none; width: 100%;
        }

        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .btn-cancel { background: transparent; color: var(--cor-texto-secundario); border: 1px solid var(--borda); padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .btn-save { background-color: var(--cor-primaria); color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .btn-edit { background-color: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
        .btn-delete { background-color: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }

        .delete-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .delete-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-principal); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--borda); }
        .delete-item-actions { display: flex; gap: 6px; }

        .menu-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .menu-btn-choice { padding: 14px; border-radius: 12px; background: var(--bg-principal); border: 1px solid var(--borda); color: var(--cor-texto); font-weight: 700; cursor: pointer; text-align: center; }

        .online-counter-card {
            background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 12px 16px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
        }
        .online-status-dot { width: 8px; height: 8px; background-color: var(--cor-primaria); border-radius: 50%; box-shadow: 0 0 8px var(--cor-primaria); }

        @media (max-width: 480px) {
            .channels-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .logo-text { font-size: 1.8rem; }
            .main-nav-btn { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>

            const connectedRef = db.ref('.info/connected');
            const myConnectionsRef = db.ref('futx_online_users');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    const con = myConnectionsRef.push();
                    con.onDisconnect().remove();
                    con.set(true);
                }
            });

            myConnectionsRef.on('value', (snap) => {
                const count = snap.numChildren();
                document.getElementById('online-users-count').innerText = count;
            });
        }

        function listenToDatabase() {
            db.ref('futx_db').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    DATABASE = {
                        tv: data.tv ? Object.values(data.tv) : [],
                        filmes: data.filmes ? Object.values(data.filmes) : [],
                        series: data.series ? Object.values(data.series) : []
                    };
                } else {
                    DATABASE = { tv: [], filmes: [], series: [] };
                }
                renderGrid();
                if (document.getElementById('manage-modal').style.display === 'flex') {
                    renderDeleteList();
                }
            });

            db.ref('futx_categories').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    CATEGORIES = {
                        tv: data.tv || {},
                        filmes: data.filmes || {},
                        series: data.series || {}
                    };
                } else {
                    CATEGORIES = { tv: {}, filmes: {}, series: {} };
                }
                renderFilters();
                updateCategoryOptions();
            });

            trackOnlineUsers();
        }

        function switchSection(section, btn) {
            currentSection = section;
            document.querySelectorAll('.main-nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFilters();
            renderGrid();
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = '';
            
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.innerText = 'Todos';
            allBtn.onclick = () => filterContent('all', allBtn);
            container.appendChild(allBtn);

            const currentCats = CATEGORIES[currentSection] || {};
            Object.keys(currentCats).forEach((catKey) => {
                const button = document.createElement('button');
                button.className = 'filter-btn';
                button.innerText = currentCats[catKey].label;
                button.onclick = () => filterContent(catKey, button);
                container.appendChild(button);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '';
            const list = DATABASE[currentSection] || [];

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--cor-texto-secundario); padding: 30px 0;">Nenhum conteúdo disponível nesta categoria.</p>';
                return;
            }

            list.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.setAttribute('data-category', item.category);
                
                card.onclick = () => openMovieDetails(item);

                card.innerHTML = `
                    <span class="badge">${item.rating ? '⭐ ' + item.rating : (item.badge || 'HD')}</span>
                    <div class="channel-logo-wrapper">
                        <img class="channel-logo" src="${item.logo || 'https://via.placeholder.com/150x225'}" alt="${item.nome}" loading="lazy">
                    </div>
                    <div class="channel-name">${item.nome}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openMovieDetails(item) {
            document.getElementById('modal-banner').style.backgroundImage = `url('${item.banner || item.logo}')`;
            document.getElementById('modal-poster').src = item.logo || 'https://via.placeholder.com/150x225';
            document.getElementById('modal-title').childNodes[0].nodeValue = item.nome + " ";
            document.getElementById('modal-year').innerText = item.year ? `(${item.year})` : '';
            document.getElementById('modal-rating').innerText = `⭐ ${item.rating || '7.0'}`;
            document.getElementById('modal-duration').innerText = `⏱ ${item.duration || '01:45:00'}`;
            document.getElementById('modal-genres').innerText = `🎭 ${item.genres || 'Filme'}`;

            const playBtn = document.getElementById('modal-play-btn');
            playBtn.onclick = () => {
                closeMovieDetails();
                openPlayerModal(item);
            };

            document.getElementById('movie-details-modal').style.display = 'flex';
        }

        function closeMovieDetails() {
            document.getElementById('movie-details-modal').style.display = 'none';
        }

        function openPlayerModal(item) {
            const isM3U8 = item.principal.includes('.m3u8');
            player.src({ src: item.principal, type: isM3U8 ? 'application/x-mpegURL' : 'video/mp4' });
            
            document.getElementById('player-modal').style.display = 'flex';
            player.play().catch(() => { player.muted(true); player.play(); });
        }

        function closePlayerModal() {
            player.pause();
            document.getElementById('player-modal').style.display = 'none';
        }

        function filterContent(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.querySelectorAll('.channel-card').forEach(card => {
                const cat = card.getAttribute('data-category');
                card.style.display = (category === 'all' || cat === category) ? 'flex' : 'none';
            });
        }

        function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function verifyPassword() {
            if (await sha256(document.getElementById('admin-password').value) === ADMIN_HASH) {
                closeModal('login-modal');
                document.getElementById('admin-password').value = '';
                showAdminMenu();
            } else { alert('Senha incorreta!'); }
        }

        function showAdminMenu() {
            closeModal('add-modal'); closeModal('edit-modal'); closeModal('manage-modal'); closeModal('categories-modal');
            document.getElementById('admin-menu-modal').style.display = 'flex';
        }

        function showAddModal() {
            closeModal('admin-menu-modal');
            updateCategoryOptions();
            document.getElementById('add-modal').style.display = 'flex';
        }

        function showCategoriesModal() {
            closeModal('admin-menu-modal');
            renderCategoriesList();
            document.getElementById('categories-modal').style.display = 'flex';
        }

        function showManageModal() {
            closeModal('admin-menu-modal'); closeModal('edit-modal');
            document.getElementById('manage-modal').style.display = 'flex';
            renderDeleteList();
        }

        function addCategory() {
            const section = document.getElementById('cat-type-select').value;
            const catName = document.getElementById('new-cat-name').value.trim();

            if (!catName) return alert('Digite o nome da categoria.');

            const catId = catName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "_");

            db.ref(`futx_categories/${section}/${catId}`).set({
                id: catId,
                label: catName
            }).then(() => {
                document.getElementById('new-cat-name').value = '';
                renderCategoriesList();
            });
        }

        function renderCategoriesList() {
            const section = document.getElementById('cat-type-select').value;
            const container = document.getElementById('cat-list-container');
            container.innerHTML = '';
            
            const cats = CATEGORIES[section] || {};
            const keys = Object.keys(cats);

            if (keys.length === 0) {
                container.innerHTML = '<p style="font-size:0.8rem; color: var(--cor-texto-secundario); padding: 10px 0;">Nenhuma categoria criada.</p>';
                return;
            }

            keys.forEach(key => {
                const row = document.createElement('div');
                row.className = 'delete-item';
                row.innerHTML = `
                    <span style="font-size: 0.9rem; font-weight: 600;">${cats[key].label}</span>
                    <button class="btn-delete" onclick="deleteCategory('${section}', '${key}')">Excluir</button>
                `;
                container.appendChild(row);
            });
        }

        function deleteCategory(section, catId) {
            if (confirm('Deseja excluir esta categoria?')) {
                db.ref(`futx_categories/${section}/${catId}`).remove().then(() => {
                    renderCategoriesList();
                });
            }
        }

        function updateCategoryOptions(targetSelectId = 'new-category', targetTypeSelectId = 'new-type') {
            const type = document.getElementById(targetTypeSelectId).value;
            const selectCat = document.getElementById(targetSelectId);
            selectCat.innerHTML = '';

            const currentCats = CATEGORIES[type] || {};
            const keys = Object.keys(keys);

            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'geral'; opt.innerText = 'Geral (Sem categoria)';
                selectCat.appendChild(opt);
                return;
            }

            keys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = currentCats[key].label;
                selectCat.appendChild(opt);
            });
        }

        function saveNewContent() {
            const type = document.getElementById('new-type').value;
            const nome = document.getElementById('new-name').value.trim();
            const url = document.getElementById('new-url').value.trim();

            if (!nome || !url) return alert('Preencha Nome e URL do vídeo.');

            const id = 'item_' + Date.now();
            const newItem = {
                id: id,
                nome: nome,
                category: document.getElementById('new-category').value,
                logo: document.getElementById('new-logo').value.trim() || 'https://via.placeholder.com/150x225',
                banner: document.getElementById('new-banner').value.trim() || '',
                year: document.getElementById('new-year').value.trim() || '',
                rating: document.getElementById('new-rating').value.trim() || '7.0',
                duration: document.getElementById('new-duration').value.trim() || '',
                genres: document.getElementById('new-genres').value.trim() || '',
                principal: url
            };

            db.ref(`futx_db/${type}/${id}`).set(newItem, (err) => {
                if (!err) {
                    alert(`"${nome}" adicionado com sucesso!`);
                    
                    document.getElementById('new-name').value = '';
                    document.getElementById('new-url').value = '';
                    document.getElementById('new-logo').value = '';
                    document.getElementById('new-banner').value = '';
                    document.getElementById('new-year').value = '';
                    document.getElementById('new-rating').value = '';
                    document.getElementById('new-duration').value = '';
                    document.getElementById('new-genres').value = '';
                    
                    document.getElementById('new-name').focus();
                } else {
                    alert('Erro ao salvar no banco de dados.');
                }
            });
        }

        function renderDeleteList() {
            const type = document.getElementById('manage-type-select').value;
            const container = document.getElementById('delete-list-container');
            container.innerHTML = '';
            const list = DATABASE[type] || [];

            if (list.length === 0) {
                container.innerHTML = '<p style="font-size:0.8rem; color: var(--cor-texto-secundario); padding: 10px 0;">Nenhum conteúdo encontrado.</p>';
                return;
            }

            list.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'delete-item';
                row.innerHTML = `
                    <span style="font-size: 0.9rem; font-weight: 600;">${item.nome}</span>
                    <div class="delete-item-actions">
                        <button class="btn-edit" onclick="openEditModal('${type}', '${item.id}')">✏️ Editar</button>
                        <button class="btn-delete" onclick="deleteItem('${type}', '${item.id}')">Excluir</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function openEditModal(type, id) {
            const list = DATABASE[type] || [];
            const item = list.find(i => i.id === id);
            if (!item) return;

            closeModal('manage-modal');

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-type').value = type;
            document.getElementById('edit-name').value = item.nome || '';
            document.getElementById('edit-url').value = item.principal || '';
            document.getElementById('edit-logo').value = item.logo || '';
            document.getElementById('edit-banner').value = item.banner || '';
            document.getElementById('edit-year').value = item.year || '';
            document.getElementById('edit-rating').value = item.rating || '';
            document.getElementById('edit-duration').value = item.duration || '';
            document.getElementById('edit-genres').value = item.genres || '';

            const selectCat = document.getElementById('edit-category');
            selectCat.innerHTML = '';
            const currentCats = CATEGORIES[type] || {};
            const keys = Object.keys(currentCats);

            if (keys.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'geral'; opt.innerText = 'Geral';
                selectCat.appendChild(opt);
            } else {
                keys.forEach(key => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = currentCats[key].label;
                    if (key === item.category) opt.selected = true;
                    selectCat.appendChild(opt);
                });
            }

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveEditedContent() {
            const id = document.getElementById('edit-id').value;
            const type = document.getElementById('edit-type').value;
            const nome = document.getElementById('edit-name').value.trim();
            const url = document.getElementById('edit-url').value.trim();

            if (!nome || !url) return alert('Preencha Nome e URL do vídeo.');

            const updatedItem = {
                id: id,
                nome: nome,
                category: document.getElementById('edit-category').value,
                logo: document.getElementById('edit-logo').value.trim() || 'https://via.placeholder.com/150x225',
                banner: document.getElementById('edit-banner').value.trim() || '',
                year: document.getElementById('edit-year').value.trim() || '',
                rating: document.getElementById('edit-rating').value.trim() || '7.0',
                duration: document.getElementById('edit-duration').value.trim() || '',
                genres: document.getElementById('edit-genres').value.trim() || '',
                principal: url
            };

            db.ref(`futx_db/${type}/${id}`).set(updatedItem, (err) => {
                if (!err) {
                    alert('Conteúdo atualizado com sucesso!');
                    showManageModal();
                } else {
                    alert('Erro ao atualizar.');
                }
            });
        }

        function deleteItem(type, id) {
            if (confirm('Excluir este item para todos os usuários?')) {
                db.ref(`futx_db/${type}/${id}`).remove().then(() => {
                    renderDeleteList();
                });
            }
        }

        window.onload = function() {
            listenToDatabase();
        };
    </script>
</body>
</html>
