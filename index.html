<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Dublagem Interativa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 20px; color: #e50914; }
    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    .legend-box {
      background: #2a2a2a;
      border-left: 4px solid #e50914;
      padding: 12px;
      margin: 15px 0;
      border-radius: 4px;
      font-size: 1.1rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-rec { background: #e50914; color: #fff; }
    .btn-stop { background: #444; color: #fff; }
    .btn-play { background: #2e7d32; color: #fff; }
    .btn-download { background: #0288d1; color: #fff; }
    .status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>DublaAí Prototype</h1>

  <div class="container">
    <!-- Player com o seu vídeo do Supabase -->
    <video id="videoPlayer" src="https://myvxsgqmwwuieeolozbt.supabase.co/storage/v1/object/sign/renders/59fe13a1-647c-490b-bf81-f160c9abfbbf/e5e2224d-bf32-40d7-bf43-c51dac41d4c9/dublagem.mp4?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV81OWIwOGMwNS04YjY1LTQyYmUtODRkMC1mYzU1OGFjZmUxZmEiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJyZW5kZXJzLzU5ZmUxM2ExLTY0N2MtNDkwYi1iZjgxLWYxNjBjOWFiZmJiZi9lNWUyMjI0ZC1iZjMyLTQwZDctYmY0My1jNTFkYWM0MWQ0YzkvZHVibGFnZW0ubXA0Iiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4NzYxMDkyMSwiZXhwIjoxNzg4MjE1NzIxfQ.jBN4NxCqtnta5Wdx7mIMs8oO69p2RtvqfugeTudoxRc" controls crossorigin="anonymous"></video>

    <!-- Legenda da cena -->
    <div class="legend-box" id="scriptBox">
      <strong>Sua Cena:</strong> Grave a sua voz acompanhando o vídeo carregado!
    </div>

    <!-- Controles da Dublagem -->
    <div class="controls">
      <button id="btnRecord" class="btn-rec">🎙️ Iniciar Dublagem</button>
      <button id="btnStop" class="btn-stop" disabled>🛑 Parar</button>
      <button id="btnPlay" class="btn-play" disabled>▶️ Testar Dublagem</button>
      <button id="btnDownload" class="btn-download" disabled>💾 Baixar Áudio</button>
    </div>

    <div class="status" id="statusText">Aguardando início...</div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const btnRecord = document.getElementById('btnRecord');
    const btnStop = document.getElementById('btnStop');
    const btnPlay = document.getElementById('btnPlay');
    const btnDownload = document.getElementById('btnDownload');
    const statusText = document.getElementById('statusText');

    let mediaRecorder;
    let audioChunks = [];
    let recordedAudioBlob;
    let recordedAudioUrl;
    let audioPreview = new Audio();

    async function setupMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedAudioUrl = URL.createObjectURL(recordedAudioBlob);
          audioPreview.src = recordedAudioUrl;

          btnPlay.disabled = false;
          btnDownload.disabled = false;
          statusText.innerText = "Gravação concluída! Clique em 'Testar Dublagem'.";
        };
      } catch (err) {
        alert("Erro ao acessar o microfone: " + err.message);
        statusText.innerText = "Permissão de microfone negada.";
      }
    }

    setupMicrophone();

    btnRecord.addEventListener('click', () => {
      if (!mediaRecorder) return;

      audioChunks = [];
      video.currentTime = 0;
      video.muted = true;
      video.play();

      mediaRecorder.start();

      btnRecord.disabled = true;
      btnStop.disabled = false;
      btnPlay.disabled = true;
      btnDownload.disabled = true;

      statusText.innerText = "🔴 Gravando sua voz... Fale agora!";
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        video.pause();

        btnRecord.disabled = false;
        btnStop.disabled = true;
      }
    });

    btnPlay.addEventListener('click', () => {
      video.currentTime = 0;
      video.muted = true;
      
      video.play();
      audioPreview.currentTime = 0;
      audioPreview.play();

      statusText.innerText = "▶️ Reproduzindo vídeo + sua voz sincronizada!";
    });

    btnDownload.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = recordedAudioUrl;
      a.download = 'minha_dublagem.webm';
      a.click();
    });

    video.addEventListener('ended', () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        btnStop.click();
      }
    });
  </script>
</body>
</html>
