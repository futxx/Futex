<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      bg: 'rgb(var(--bg) / <alpha-value>)',
      surface: 'rgb(var(--surface) / <alpha-value>)',
      surface2: 'rgb(var(--surface2) / <alpha-value>)',
      line: 'rgb(var(--line) / <alpha-value>)',
      fg: 'rgb(var(--fg) / <alpha-value>)',
      mute: 'rgb(var(--mute) / <alpha-value>)',
      accent: 'rgb(var(--accent) / <alpha-value>)',
      accent2: 'rgb(var(--accent2) / <alpha-value>)',
      live: 'rgb(var(--live) / <alpha-value>)'
    },
    fontFamily: {
      display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],

};

<style>
/* Layout: sticky top bar (nav links on md+), bottom tab bar on phones, then a hero carousel and horizontal poster rows.
   Dark-only by design: deep navy surfaces, cyan accent. Colors are RGB channels so Tailwind alpha modifiers work. */
:root{
  --bg:6 10 21; --surface:13 20 36; --surface2:21 30 51; --line:36 50 78;
  --fg:232 238 248; --mute:146 160 188; --accent:34 211 238; --accent2:59 130 246; --live:239 68 68;
  color-scheme:dark;
}
html{background:rgb(var(--bg))}
body{margin:0;background:rgb(var(--bg));color:rgb(var(--fg));font:400 15px/1.5 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgb(var(--bg))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px;border-radius:6px}
.art{position:absolute;inset:0;overflow:hidden}

/* navigation */
.navlink{position:relative;padding:.5rem .1rem;font-weight:500;color:rgb(var(--mute));transition:color .2s}
.navlink:hover{color:rgb(var(--fg))}
.navlink[aria-current=page]{color:rgb(var(--fg))}
.navlink[aria-current=page]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:rgb(var(--accent))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.55rem 0 .45rem;font-size:11px;font-weight:500;color:rgb(var(--mute))}
.tab[aria-current=page]{color:rgb(var(--accent))}
.iconbtn{position:relative;display:grid;place-items:center;height:40px;width:40px;border-radius:999px;color:rgb(var(--fg)/.9);transition:background .2s}
.iconbtn:hover{background:rgb(255 255 255/.1)}
.pop{position:absolute;top:calc(100% + 6px);right:max(16px,env(safe-area-inset-right,0px));z-index:70;width:min(340px,calc(100vw - 32px));padding:.5rem;border-radius:.9rem;background:rgb(var(--surface2));border:1px solid rgb(var(--line));box-shadow:0 18px 50px rgb(0 0 0/.5)}

/* buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.6rem 1.2rem;border-radius:.65rem;font-weight:700;font-size:.95rem;transition:filter .2s,background .2s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:rgb(var(--accent));color:rgb(var(--bg))}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.18)}
.btn-ghost:hover{background:rgb(255 255 255/.18)}
.btn-icon{padding:0;width:44px}
.ctl{display:grid;place-items:center;height:36px;width:36px;flex:none;border-radius:999px;background:rgb(255 255 255/.12);transition:background .2s}
.ctl:hover{background:rgb(255 255 255/.24)}
.chip{flex:none;padding:.4rem 1rem;border-radius:999px;border:1px solid rgb(var(--line));color:rgb(var(--mute));font-size:.875rem;font-weight:500;transition:all .2s;white-space:nowrap}
.chip:hover{color:rgb(var(--fg));border-color:rgb(var(--mute))}
.chip[aria-pressed=true]{background:rgb(var(--accent));border-color:rgb(var(--accent));color:rgb(var(--bg));font-weight:700}
.pill{display:inline-block;padding:.12rem .5rem;border-radius:.3rem;border:1px solid rgb(255 255 255/.28);font-size:11px;font-weight:700;color:rgb(var(--fg)/.9)}
.tagchip{display:inline-block;padding:.15rem .4rem;border-radius:.25rem;background:rgb(var(--bg)/.72);border:1px solid rgb(var(--accent)/.55);color:rgb(var(--accent));font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.livebadge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .5rem;border-radius:.3rem;background:rgb(var(--live));color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em}
.livebadge i{height:6px;width:6px;border-radius:99px;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* cards and rows */
.scroller{scrollbar-width:none;scroll-padding-left:10px}
.scroller::-webkit-scrollbar{display:none}
.card{transition:transform .25s ease}
.hoverinfo{display:none;pointer-events:none}
.hoverinfo button{pointer-events:auto}
.mini{display:grid;place-items:center;height:32px;width:32px;border-radius:99px;background:rgb(255 255 255/.16);transition:background .2s}
.mini:hover{background:rgb(255 255 255/.3)}
.mini.accent{background:rgb(var(--accent));color:rgb(var(--bg))}
.playdot{display:grid;place-items:center;height:44px;width:44px;border-radius:99px;background:rgb(var(--bg)/.6);border:1px solid rgb(255 255 255/.4);opacity:.9}
@media (hover:hover){
  .card:hover,.card:focus-within{transform:scale(1.07);z-index:5}
  .hoverinfo{display:flex;opacity:0;transition:opacity .2s;background:linear-gradient(to top,rgb(5 8 16/.96) 58%,rgb(5 8 16/.35))}
  .card:hover .hoverinfo,.card:focus-within .hoverinfo{opacity:1}
  .card:hover .ptitle,.card:focus-within .ptitle{opacity:0}
  .rowwrap:hover .rowbtn{opacity:1}
}
.rowbtn{display:none;position:absolute;top:calc(50% - 22px);z-index:10;height:44px;width:44px;place-items:center;border-radius:99px;background:rgb(var(--bg)/.85);border:1px solid rgb(var(--line));opacity:0;transition:opacity .2s}
@media (hover:hover){.rowbtn{display:grid}}

/* hero */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}
.slide.is-active{opacity:1;visibility:visible}
.dot{height:8px;width:24px;border-radius:99px;background:rgb(255 255 255/.3);transition:all .3s}
.dot[aria-current=true]{width:40px;background:rgb(var(--accent))}

/* simulated video */
.drift svg,.drift img{animation:drift 16s ease-in-out infinite alternate;animation-play-state:paused;transform-origin:50% 50%}
.drift.is-playing svg,.drift.is-playing img{animation-play-state:running}
@keyframes drift{from{transform:scale(1.04) translate3d(-1.5%,0,0)}to{transform:scale(1.14) translate3d(2%,-1.5%,0)}}
.seek{accent-color:rgb(var(--accent));height:20px}

/* programme grid */
.epgb{position:absolute;top:6px;bottom:6px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:.25rem .65rem;text-align:left;border-radius:.5rem;background:rgb(var(--surface2));border:1px solid rgb(var(--line));transition:border-color .2s}
.epgb:hover{border-color:rgb(var(--mute))}
.epgb b{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epgb span{font-size:.72rem;color:rgb(var(--mute));font-variant-numeric:tabular-nums;white-space:nowrap}
.epgb.is-now{background:rgb(var(--accent)/.14);border-color:rgb(var(--accent))}

/* editor do catálogo */
.lbl{display:block;margin-bottom:.4rem;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgb(var(--mute))}
.inp{display:block;width:100%;min-height:44px;padding:.55rem .85rem;border-radius:.65rem;background:rgb(var(--bg));border:1px solid rgb(var(--line));color:rgb(var(--fg));font:inherit;transition:border-color .2s}
.inp:focus{border-color:rgb(var(--accent));outline:none}
.inp::placeholder{color:rgb(var(--mute)/.8)}
textarea.inp{min-height:96px;resize:vertical}
[hidden]{display:none!important}
.danger{background:rgb(var(--live))!important;border-color:transparent!important;color:#fff!important}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
@media (min-width:768px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<header class="sticky z-50 border-b border-line/70 bg-bg/85 backdrop-blur-md" style="top:env(safe-area-inset-top,0px)">
  <div class="gut">
    <div class="mx-auto flex h-16 max-w-[1500px] items-center gap-4 md:gap-9">
      <a href="#inicio" class="flex items-center gap-2" aria-label="Vela Play, início">
        <svg viewBox="0 0 26 24" class="h-7 w-7 text-accent" fill="currentColor" aria-hidden="true"><path d="M3 21 13 2v19Z"/><path d="M15.5 21V8.5L24 21Z" opacity=".6"/><path d="M2 23h22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span class="font-display text-[22px] font-extrabold leading-none tracking-tight">vela<span class="text-accent">play</span></span>
      </a>
      <nav id="topnav" class="hidden items-center gap-7 md:flex" aria-label="Principal"></nav>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1">
        <button id="admin-access" type="button" aria-label="Acesso do administrador" title="Acesso do administrador" style="display:flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 12px;border:1px solid rgb(var(--accent));border-radius:999px;color:rgb(var(--accent));font-size:12px;font-weight:800;letter-spacing:.04em;white-space:nowrap;background:rgb(var(--accent)/.08)">🔒 ADMIN</button>
        <button class="iconbtn" data-act="add" data-owner hidden aria-label="Adicionar ao catálogo"><span class="contents" data-ic="plus"></span></button>
        <button class="iconbtn" data-act="search" aria-label="Pesquisar"><span class="contents" data-ic="search"></span></button>
        <button class="iconbtn" data-act="notif" aria-label="Notificações" aria-haspopup="true"><span class="contents" data-ic="bell"></span><span id="dot" class="absolute right-2 top-2 h-2 w-2 rounded-full bg-accent ring-2 ring-bg"></span></button>
        <button class="iconbtn" data-act="prof" aria-label="Perfil do usuário" aria-haspopup="true"><span class="grid h-8 w-8 place-items-center rounded-full bg-gradient-to-br from-accent to-accent2 text-sm font-extrabold text-bg">V</span></button>
      </div>
    </div>
  </div>
  <div id="pn" class="pop" hidden></div>
  <div id="pp" class="pop" hidden></div>
</header>

<main class="gut pb-28 md:pb-16">
  <div id="app" class="mx-auto max-w-[1500px]"></div>
  <footer class="mx-auto mt-14 max-w-[1500px] border-t border-line pt-6 text-xs text-mute">Vela Play é um protótipo com títulos, canais e programação fictícios. Os vídeos são anexados pelo dono do catálogo. <a href="#gerenciar" class="text-accent hover:underline" data-owner hidden>Gerenciar catálogo</a></footer>
</main>

<nav id="tabs" class="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-surface/95 backdrop-blur md:hidden" style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Principal">
  <div class="gut"><div id="tabgrid" class="grid grid-cols-5"></div></div>
</nav>

<div id="search" hidden class="fixed inset-0 z-[100] overflow-y-auto bg-bg/95 backdrop-blur-xl" role="dialog" aria-modal="true" aria-label="Pesquisar">
  <div class="gut" style="padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)">
    <div class="mx-auto max-w-[1100px]">
      <div class="flex items-center gap-3">
        <div class="relative min-w-0 flex-1">
          <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-mute"><span class="contents" data-ic="search"></span></span>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar filmes, séries e canais" aria-label="Buscar" class="h-14 w-full rounded-xl border border-line bg-surface pl-12 pr-4 text-base text-fg placeholder:text-mute focus:border-accent focus:outline-none">
          <div id="sug" hidden class="absolute inset-x-0 top-[calc(100%+6px)] z-10 overflow-hidden rounded-xl border border-line bg-surface2 shadow-2xl"></div>
        </div>
        <button class="btn btn-ghost" data-act="closesearch">Fechar</button>
      </div>
      <div id="schips" class="mt-5"></div>
      <div id="sres" class="mt-7" aria-live="polite"></div>
    </div>
  </div>
</div>

<div id="detail" hidden class="fixed inset-0 z-[110] flex items-end justify-center bg-black/70 sm:items-center sm:p-6">
  <div id="panel" class="relative max-h-[94vh] w-full max-w-3xl overflow-y-auto rounded-t-2xl bg-surface ring-1 ring-white/10 sm:rounded-2xl" role="dialog" aria-modal="true" aria-labelledby="dtitle"></div>
</div>

<div id="pin" hidden class="fixed inset-0 z-[125] grid place-items-center bg-black/75 p-4">
  <form id="pin-form" class="w-full max-w-xs rounded-2xl bg-surface p-6 ring-1 ring-white/10" role="dialog" aria-modal="true" aria-labelledby="pin-title" novalidate>
    <h2 id="pin-title" class="font-display text-xl font-extrabold">Área restrita</h2>
    <p class="mt-1 text-sm text-mute">Digite a senha para gerenciar o catálogo.</p>
    <label class="lbl mt-4" for="pin-input">Senha</label>
    <input id="pin-input" class="inp text-center text-xl" style="letter-spacing:.4em" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <p id="pin-err" class="mt-2 min-h-[1.25rem] text-sm font-bold text-live" role="alert"></p>
    <div class="mt-3 flex gap-3"><button type="button" class="btn btn-ghost flex-1" data-pin="cancel">Cancelar</button><button type="submit" class="btn btn-primary flex-1">Entrar</button></div>
  </form>
</div>

<div id="editor" hidden class="fixed inset-0 z-[115] flex items-end justify-center bg-black/70 sm:items-center sm:p-6">
  <div id="epanel" class="relative max-h-[94vh] w-full max-w-2xl overflow-y-auto rounded-t-2xl bg-surface ring-1 ring-white/10 sm:rounded-2xl" role="dialog" aria-modal="true" aria-labelledby="etitle"></div>
</div>

<div id="toast" class="toast pointer-events-none fixed left-1/2 z-[120] -translate-x-1/2 rounded-full bg-surface2 px-4 py-2 text-sm ring-1 ring-white/15 opacity-0 transition-opacity" role="status" aria-live="polite"></div>

<script>
/* ============ Utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const pad = n => String(n).padStart(2, '0');
const fmt = m => pad(Math.floor(m / 60) % 24) + ':' + pad(((m % 60) + 60) % 60);
const fmtMin = m => Math.floor(m / 60) + 'h ' + pad(m % 60) + 'min';
const tm = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ Icons (Lucide paths) ============ */
const P = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
  tv: '<rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>',
  radio: '<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
  mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'
};
const ic = (n, c = 'h-5 w-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="${/fill-current/.test(c) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic); });

/* ============ Mock data ============ */
const BASE_GENRES = ['Ação', 'Comédia', 'Drama', 'Sci-Fi', 'Terror', 'Aventura', 'Suspense', 'Animação', 'Documentário', 'Romance'];
const ALIAS = { 'Sci-Fi': 'ficcao cientifica scifi sci fi', 'Terror': 'horror medo', 'Comédia': 'humor', 'Animação': 'desenho infantil', 'Documentário': 'doc' };
/* [titulo, tipo(f=filme, s=serie), ano, classificacao, generos, minutos(filme) ou temporadas(serie), afinidade, tags, matiz, forma, sinopse] */
const RAW = [
  ['Última Maré', 'f', 2026, 14, 'Sci-Fi,Aventura', 128, 94, 'Top 10,4K', 200, 'waves', 'Quando o oceano recua pela primeira vez em mil anos, uma bióloga marinha encontra uma cidade submersa que ainda emite sinais.'],
  ['Fuso Zero', 'f', 2026, 16, 'Ação,Suspense', 112, 91, 'Top 10,4K', 12, 'city', 'Um controlador de voo tem 90 minutos para impedir que um comboio de aeronaves se cruze sobre o Atlântico.'],
  ['O Último Fusível', 'f', 2025, 12, 'Comédia', 97, 86, 'Novo', 45, 'rings', 'Dois eletricistas rivais ficam presos em um prédio comercial na noite do maior apagão da cidade.'],
  ['Cidade de Sal', 'f', 2025, 16, 'Drama', 134, 89, '4K', 340, 'sun', 'Em uma cidade litorânea que perde moradores a cada safra, uma família decide reabrir a salina do avô.'],
  ['Rota 404', 'f', 2026, 14, 'Ação,Aventura', 118, 84, '4K,Dolby Atmos', 28, 'diag', 'Uma entregadora de motocicleta cruza o país com uma encomenda que várias pessoas querem interceptar.'],
  ['Noite no Observatório', 'f', 2025, 18, 'Terror,Suspense', 103, 82, '', 265, 'stars', 'Quatro astrônomos notam uma estrela que muda de lugar toda vez que ninguém está olhando.'],

/* Programação gerada em ciclo a partir do horário atual, para o "agora" sempre fazer sentido */
function sched(ch, n = 12) {
  const total = ch.progs.reduce((a, p) => a + p[1], 0), m = nowMin();
  let pos = (m + ch.shift) % total, i = 0;
  while (pos >= ch.progs[i][1]) { pos -= ch.progs[i][1]; i++; }
  let start = m - pos; const out = [];
  for (let k = 0; k < n; k++) {
    const p = ch.progs[(i + k) % ch.progs.length];
    out.push({ title: p[0], start, end: start + p[1], prog: k === 0 ? pos / p[1] : 0 });
    start += p[1];
  }
  return out;
}

function showSlide(i) {
  const hs = $('.hero'); if (!hs) return;
  const sl = [...hs.querySelectorAll('.slide')];
  state.hero = (i + sl.length) % sl.length;
  sl.forEach((s, k) => { const on = k === state.hero; s.classList.toggle('is-active', on); s.inert = !on; });
  hs.querySelectorAll('.dot').forEach((d, k) => d.setAttribute('aria-current', k === state.hero ? 'true' : 'false'));
}
function initHero() {
  clearInterval(heroTimer);
  const hs = $('.hero'); if (!hs) return;
  showSlide(state.hero < hs.querySelectorAll('.slide').length ? state.hero : 0);
  let paused = false, x0 = null;
  hs.addEventListener('mouseenter', () => paused = true);
  hs.addEventListener('mouseleave', () => paused = false);
  hs.addEventListener('focusin', () => paused = true);
  hs.addEventListener('focusout', () => paused = false);
  hs.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  hs.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) showSlide(state.hero + (dx < 0 ? 1 : -1)); x0 = null; });
  if (!reduceMotion) heroTimer = setInterval(() => { if (!paused && !document.hidden && !modalOpen()) showSlide(state.hero + 1); }, 7000);
}

function epg() {
  const m = nowMin(), t0 = Math.floor(m / 30) * 30, ppm = 4, span = 240, W = span * ppm, L = 132;
  const ticks = Array.from({ length: span / 30 }, (_, k) => `<span class="absolute top-1.5 text-xs tabular-nums text-mute" style="left:${k * 30 * ppm + 8}px">${fmt(t0 + k * 30)}</span>`).join('');
  const rows = CH.map(ch => {
    const blocks = sched(ch, 14).map(s => {
      const a = Math.max(s.start, t0), b = Math.min(s.end, t0 + span);
      if (b <= a) return '';
      const cur = s.start <= m && m < s.end;
      return `<button data-chan="${ch.id}" class="epgb ${cur ? 'is-now' : ''}" style="left:${(a - t0) * ppm}px;width:${(b - a) * ppm - 4}px" title="${esc(s.title)}, ${fmt(s.start)} - ${fmt(s.end)}"><b>${esc(s.title)}</b><span>${fmt(s.start)} - ${fmt(s.end)}</span></button>`;
    }).join('');
    return `<div class="flex border-t border-line"><div class="sticky left-0 z-[2] flex w-[${L}px] flex-none items-center bg-surface px-3"><button data-chan="${ch.id}" class="truncate text-left text-sm font-bold hover:text-accent"><span class="mr-1.5 tabular-nums text-mute">${ch.n}</span>${esc(ch.name)}</button></div><div class="relative h-[62px] flex-none" style="width:${W}px">${blocks}</div></div>`;
  }).join('');
  return `<div class="mt-3 overflow-x-auto rounded-xl border border-line bg-surface"><div class="relative" style="width:${W + L}px">
    <div class="flex"><div class="sticky left-0 z-[2] w-[${L}px] flex-none bg-surface px-3 py-2 text-xs font-bold uppercase tracking-widest text-mute">Canal</div><div class="relative h-8 flex-none" style="width:${W}px">${ticks}</div></div>
    ${rows}
    <div class="pointer-events-none absolute bottom-0 top-0 z-[1] w-px bg-live" style="left:${L + (m - t0) * ppm}px"></div>
  </div></div>`;
}

function runSearch(qs) {
  const toks = norm(qs).split(/\s+/).filter(Boolean);
  if (!toks.length) return { items: [], chs: [] };
  const first = x => norm(x.title).startsWith(toks[0]) ? 1 : 0;
  return {
    items: BLOB.filter(x => toks.every(t => x.b.includes(t))).map(x => x.it).sort((a, b) => first(b) - first(a) || b.score - a.score),
    chs: CHB.filter(x => toks.every(t => x.b.includes(t))).map(x => x.c)

}

const vdb = {

    });
  },
  async tx(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const t = db.transaction('v', mode), rq = fn(t.objectStore('v'));
        t.oncomplete = () => res(rq ? rq.result : true);
        t.onerror = t.onabort = () => rej(t.error);

    } catch (e) { return undefined; }
  },
  async put(k, blob) { return (await this.tx('readwrite', s => s.put(blob, k))) !== undefined; },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  async del(k) { await this.tx('readwrite', s => s.delete(k)); },
  async clear() { await this.tx('readwrite', s => s.clear()); }
};

  if ($('#f-episodes')) ed.episodes = erows.map(r => ({ season: Number(r.querySelector('.f-eseason').value), number: Number(r.querySelector('.f-eepisode').value), title: r.querySelector('.f-etitle').value.trim(), src: r.querySelector('.f-esrc').value.trim(), file: r.querySelector('.f-efile')?.files?.[0] || null, hasVideo: !!(ed.episodes.find(ep => ep.season === Number(r.querySelector('.f-eseason').value) && ep.number === Number(r.querySelector('.f-eepisode').value)) || {}).hasVideo, vname: (ed.episodes.find(ep => ep.season === Number(r.querySelector('.f-eseason').value) && ep.number === Number(r.querySelector('.f-eepisode').value)) || {}).vname || '' }));
  return { title: g('f-title'), syn: g('f-syn'), year: g('f-year'), age: g('f-age'), len: g('f-len'), n: g('f-n'), src: g('f-src'), hue: g('f-hue'), shape: g('f-shape') };
}
function updPreview() {
  const p = $('#f-prev'); if (!p) return;
  const c = ed.kind === 'c';
  p.innerHTML = art({ hue: +$('#f-hue').value, shape: $('#f-shape').value, img: ed.img }, c ? 320 : 200, c ? 180 : 300);
}
function loadImage(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('Escolha um arquivo de imagem.');
  const isC = ed.kind === 'c', fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const r = Math.min(1, (isC ? 640 : 440) / im.width, (isC ? 360 : 660) / im.height);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * r)); c.height = Math.max(1, Math.round(im.height * r));
      const x = c.getContext('2d'); x.fillStyle = '#0d1424'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      ed.img = c.toDataURL('image/jpeg', .82); c.toBlob(b => { ed.imgBlob = b; }, 'image/jpeg', .82); updPreview();
    };
    im.onerror = () => toast('Não foi possível ler essa imagem.');
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function formError(msg, sel) { $('#f-err').textContent = msg; (document.querySelector(sel) || $('#f-title')).focus(); }
function saveEditor() {
  const f = readForm(), k = ed.kind, isC = k === 'c';
  const title = f.title.trim().replace(/\s+/g, ' ');
  if (!title) return formError(isC ? 'Informe o nome do canal.' : 'Informe o título.', '#f-title');
  const hue = Math.max(0, Math.min(359, Math.round(+f.hue || 0)));
  const src = cleanSrc(f.src);
  if (src === false) return formError('O link do vídeo precisa começar com http:// ou https://.', '#f-src');
  if (isC) {
    const n = Math.round(+f.n);
    if (!(n >= 1 && n <= 9999)) return formError('O número do canal deve estar entre 1 e 9999.', '#f-n');
    const progs = [];
    for (const [pt, pm] of ed.progs) {
      const name = String(pt).trim(), mins = Math.round(+pm);
      if (!name && !String(pm).trim()) continue;
      if (!name || !(mins >= 5 && mins <= 600)) return formError('Cada programa precisa de nome e duração entre 5 e 600 minutos.', '#f-progs input');
      progs.push([name, mins]);
    }
    if (!progs.length) return formError('Adicione pelo menos um programa à grade.', '#f-progs input');
    const data = { n, name: title, hue, shape: f.shape, img: ed.img, progs, src };
    const old = ed.id != null ? CH.find(c => c.id === ed.id) : null;
    if (old) Object.assign(old, data);
    else CH.push({ id: 'c' + (Math.max(0, ...CH.map(c => parseInt(String(c.id).slice(1), 10) || 0)) + 1), shift: Math.floor(Math.random() * 60), added: Date.now(), ...data });
  } else {
    const year = Math.round(+f.year), len = Math.round(+f.len);
    if (!(year >= 1900 && year <= 2100)) return formError('Informe um ano entre 1900 e 2100.', '#f-year');
    if (!(len >= 1 && len <= (k === 'f' ? 600 : 60))) return formError(k === 'f' ? 'A duração deve ter entre 1 e 600 minutos.' : 'Informe de 1 a 60 temporadas.', '#f-len');
    const genres = GENRES.filter(g => ed.genres.has(g));
    if (k === 's') {
      for (const ep of ed.episodes) {
        if (!(ep.season >= 1 && ep.season <= len) || !(ep.number >= 1 && ep.number <= 9999)) return formError('Confira a temporada e o número de cada episódio.', '#f-episodes input');
        const clean = cleanSrc(ep.src); if (clean === false || (!clean && !ep.file && !ep.hasVideo)) return formError('Informe um link válido ou envie um arquivo para cada episódio cadastrado.', '#f-episodes .f-esrc'); ep.src = clean || '';
      }
      ed.episodes.sort((a,b) => (a.season-b.season)||(a.number-b.number));
      for (let i=1;i<ed.episodes.length;i++) if (ed.episodes[i].season===ed.episodes[i-1].season && ed.episodes[i].number===ed.episodes[i-1].number) return formError('Não repita o número de episódio dentro da mesma temporada.', '#f-episodes input');
    }
    if (!genres.length) return formError('Escolha pelo menos um gênero ou crie um novo.', '#f-genres button, #f-newgenre');
    const data = { title, type: k, year, age: f.age === 'L' ? 'L' : +f.age, genres, len, ...(k === 's' ? { episodes: ed.episodes.map(ep => ({...ep})) } : {}), mins: k === 'f' ? len : 48, syn: f.syn.trim() || 'Sem sinopse.', tags: TAGS.filter(t => ed.tags.has(t)), hue, shape: f.shape, img: ed.img, src };
    const old = ed.id != null ? BY[ed.id] : null;
    if (old) Object.assign(old, data);
    else DATA.push({ id: Math.max(0, ...DATA.map(d => d.id)) + 1, score: 80, added: Date.now(), ...data });
  }
  const wasNew = ed.id == null;
  const target = ed.id != null ? (isC ? CH.find(c => c.id === ed.id) : BY[ed.id]) : (isC ? CH[CH.length - 1] : DATA[DATA.length - 1]);
  const done = async () => {
    if (!isC && k === 's' && Array.isArray(target.episodes)) {
      for (const ep of target.episodes) {
        if (ep.file) { const ok = await vdb.put(`e:${target.id}:${ep.season}:${ep.number}`, ep.file); if (!ok) toast('Não foi possível salvar o arquivo do episódio.'); else { ep.hasVideo = true; ep.vname = ep.file.name; } delete ep.file; }
      }
    }
    saveCatalog(); closeEditor();
    renderNotifPanel();
    if (state.view === 'gerenciar') state.mtab = isC ? 'c' : k;
    toast(wasNew ? title + ' foi adicionado ao catálogo' : title + ' foi atualizado');
    refresh();
  };
  const key = vkey(isC, target.id), vf = ed.videoFile;
  if (MODE === 'shared') { persistMediaShared(target, vf).then(done); return; }
  if (vf) {
    vdb.put(key, vf).then(ok => {
      if (ok) { target.hasVideo = true; target.vname = vf.name; }
      else toast('Não foi possível guardar o vídeo: falta espaço no navegador.');
      done();
    });
  } else if (ed.rmVideo && target.hasVideo) {
    vdb.del(key).then(() => { target.hasVideo = false; target.vname = ''; done(); });
  } else done();
}

/* Gêneros */
function addGenreName(name) {
  name = name.trim().replace(/\s+/g, ' ');
  if (!name) return null;
  const found = GENRES.find(g => norm(g) === norm(name));
  if (found) return found;
  GENRES.push(name); saveCatalog(); return name;
}
function addGenreFromInput() {
  const inp = $('#f-newgenre'), g = addGenreName(inp.value);
  if (!g) return;
  inp.value = ''; ed.genres.add(g);
  $('#f-genres').innerHTML = GENRES.map(x => genreChip(x)).join('');
}
function newGenreFromManage() {
  const inp = $('#gnew'), name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) return toast('Informe o nome do gênero.');
  if (GENRES.some(g => norm(g) === norm(name))) return toast('Esse gênero já existe.');
  addGenreName(name); toast('Gênero ' + name + ' criado'); refresh();
}
function renameGenre(old, nu) {
  nu = (nu || '').trim().replace(/\s+/g, ' ');
  if (!nu) return toast('Informe um nome para o gênero.');
  if (norm(nu) !== norm(old) && GENRES.some(g => norm(g) === norm(nu))) return toast('Já existe um gênero com esse nome.');
  GENRES[GENRES.indexOf(old)] = nu;
  DATA.forEach(d => { d.genres = d.genres.map(g => g === old ? nu : g); });
  if (state.cat === old) state.cat = nu;
  saveCatalog(); toast('Gênero renomeado para ' + nu); refresh();
}
function deleteGenre(g) {
  GENRES.splice(GENRES.indexOf(g), 1);
  DATA.forEach(d => { d.genres = d.genres.filter(x => x !== g); });
  state.genre = 'Todos'; state.cat = null;
  saveCatalog(); toast('Gênero ' + g + ' excluído'); refresh();
}

/* Exclusões (confirmação em dois cliques, sem confirm()) */
function armed(btn, label, fn) {
  if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; return fn(); }
  const html = btn.innerHTML;
  btn.textContent = label; btn.classList.add('danger');
  btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.innerHTML = html; btn.classList.remove('danger'); }, 3500);
}
function deleteItem(id) {
  const it = BY[id]; if (!it) return;
  DATA.splice(DATA.indexOf(it), 1); vdb.del(vkey(false, id)); dropAssets(it);
  state.list.delete(id); store.set('vela-list', [...state.list]);
  state.cw = state.cw.filter(x => x[0] !== id); store.set('vela-cw', state.cw);
  saveCatalog(); toast(it.title + ' foi excluído'); refresh();
}
function deleteChannel(id) {
  const i = CH.findIndex(c => c.id === id); if (i < 0) return;
  const [c] = CH.splice(i, 1); vdb.del(vkey(true, id)); dropAssets(c);
  if (state.chan === id) state.chan = CH[0] ? CH[0].id : '';
  saveCatalog(); toast(c.name + ' foi excluído'); refresh();
}
function resetCatalog() {
  try { localStorage.removeItem(CAT_KEY); } catch (e) {} vdb.clear();
  loadCatalog(); state.genre = 'Todos'; state.cat = null; state.chan = 'c1'; if (MODE === 'shared') saveCatalog();
  toast('Catálogo original restaurado'); refresh();
}

/* Ações dos botões do editor e da tela de gerenciamento */
function catalogAction(act, d, t) {
  if (!IS_OWNER) return;
  switch (act) {
    case 'add': openEditor(d.arg || { filmes: 'f', series: 's', 'ao-vivo': 'c' }[state.view] || 'f', null); break;
    case 'importlocal': armed(t, 'Confirmar importação', importLocal); break;
    case 'lock': UNLOCKED = false; syncAccess(); location.hash = 'inicio'; break;
    case 'gerenciar': closePops(); location.hash = 'gerenciar'; break;
    case 'editgenres': state.mtab = 'g'; location.hash = 'gerenciar'; break;
    case 'mtab': state.mtab = d.arg; refresh(); break;
    case 'edit': { const it = BY[+d.arg]; if (it) openEditor(it.type, it); break; }
    case 'editc': { const c = CH.find(x => x.id === d.arg); if (c) openEditor('c', c); break; }
    case 'del': armed(t, 'Confirmar?', () => deleteItem(+d.arg)); break;
    case 'delc': armed(t, 'Confirmar?', () => deleteChannel(d.arg)); break;
    case 'rengenre': renameGenre(GENRES[+d.arg], $('#gname-' + d.arg).value); break;
    case 'delgenre': armed(t, 'Confirmar?', () => deleteGenre(GENRES[+d.arg])); break;
    case 'newgenre': newGenreFromManage(); break;
    case 'resetcat': armed(t, 'Confirmar restauração', resetCatalog); break;
    case 'closeeditor': closeEditor(); break;
    case 'ekind': { const dr = readForm(); dr.len = ''; ed.kind = d.arg; $('#epanel').innerHTML = editorHTML(dr); updPreview(); $('#f-title').focus(); break; }
    case 'egenre': ed.genres.has(d.arg) ? ed.genres.delete(d.arg) : ed.genres.add(d.arg); t.setAttribute('aria-pressed', ed.genres.has(d.arg)); break;
    case 'etag': ed.tags.has(d.arg) ? ed.tags.delete(d.arg) : ed.tags.add(d.arg); t.setAttribute('aria-pressed', ed.tags.has(d.arg)); break;
    case 'addgenre': addGenreFromInput(); break;
    case 'addprog': { $('#f-progs').insertAdjacentHTML('beforeend', progRow(['', 30])); $('#f-progs').lastElementChild.querySelector('input').focus(); break; }
    case 'addepisode': { const rows = [...document.querySelectorAll('#f-episodes [data-episode]')]; const last = rows.length ? rows[rows.length-1] : null; const season = last ? Math.max(1, +last.querySelector('.f-eseason').value || 1) : 1; const number = last && +last.querySelector('.f-eseason').value === season ? (+last.querySelector('.f-eepisode').value || 0)+1 : 1; $('#f-episodes').insertAdjacentHTML('beforeend', episodeRow({season, number})); break; }
    case 'delep': t.closest('[data-episode]').remove(); break;
    case 'playepisode': { const [season, number] = d.arg.split(':').map(Number); playEpisode(season, number); break; }
    case 'delprog': t.closest('[data-prog]').remove(); break;
    case 'rmvideo': { ed.videoFile = null; ed.rmVideo = true; const vi = $('#f-video'); if (vi) vi.value = ''; const si = $('#f-src'); if (si) si.value = ''; updVStatus(); break; }
    case 'rmimg': { ed.img = ''; ed.imgBlob = null; const fi = $('#f-file'); if (fi) fi.value = ''; updPreview(); break; }
  }
}
document.addEventListener('submit', e => { if (e.target.id === 'eform') { e.preventDefault(); saveEditor(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'f-file') loadImage(e.target.files[0]);
  if (e.target.id === 'f-video') {
    const f = e.target.files[0];
    if (f && !/^video\//.test(f.type)) { e.target.value = ''; return toast('Escolha um arquivo de vídeo.'); }
    ed.videoFile = f || null; ed.rmVideo = false; updVStatus();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'f-hue' || e.target.id === 'f-shape') updPreview(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#editor').hidden) return closeEditor();
  if (e.key !== 'Enter') return;
  const id = e.target.id || '';
  if (id === 'f-newgenre') { e.preventDefault(); addGenreFromInput(); }
  else if (id === 'gnew') { e.preventDefault(); newGenreFromManage(); }
  else if (id.startsWith('gname-')) { e.preventDefault(); renameGenre(GENRES[+id.slice(6)], e.target.value); }
});

/* ============ Events ============ */
document.addEventListener('click', e => {
  if (e.target === $('#detail')) return closeDetail();
  if (e.target === $('#editor')) return closeEditor();
  const t = e.target.closest('[data-open],[data-play],[data-toggle],[data-scroll],[data-genre],[data-chan],[data-hero],[data-act]');
  if (!e.target.closest('.pop') && !(t && (t.dataset.act === 'notif' || t.dataset.act === 'prof'))) closePops();
  if (!t) return;
  const d = t.dataset;
  if (d.toggle) return toggleList(+d.toggle);
  if (d.play || d.open) { if (!$('#search').hidden) addRecent($('#q').value); return openDetail(+(d.play || d.open), !!d.play); }
  if (d.scroll) { const s = t.closest('.rowwrap').querySelector('.scroller'); return s.scrollBy({ left: +d.scroll * s.clientWidth * .85, behavior: reduceMotion ? 'auto' : 'smooth' }); }
  if (d.genre) { state.genre = d.genre; return render(); }
  if (d.chan) {
    state.chan = d.chan;
    if (!$('#search').hidden) { addRecent($('#q').value); $('#search').hidden = true; syncLock(); }
    if (state.view === 'ao-vivo') { render(); window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); } else location.hash = 'ao-vivo';
    return;
  }
  if (d.hero) { showSlide(d.hero === 'next' ? state.hero + 1 : d.hero === 'prev' ? state.hero - 1 : +d.hero); return; }
  switch (d.act) {
    case 'search': openSearch(); break;
    case 'closesearch': closeSearch(); break;
    case 'notif': {
      const latest = getCatalogNotifications().reduce((m, x) => Math.max(m, x.time), 0);
      if (latest) store.set(NOTIF_SEEN_KEY, latest);
      renderNotifPanel();
      togglePop('pn');
      break;
    }
    case 'prof': togglePop('pp'); break;
    case 'closedetail': closeDetail(); break;
    case 'pstart': startPlay(); break;
    case 'pplay': state.playing ? pausePlay() : resumePlay(); break;
    case 'pmute': state.muted = !state.muted; updStage(); break;
    case 'livepause': state.livePlay = !state.livePlay; render(); break;
    case 'livemute': state.liveMute = !state.liveMute; render(); break;
    case 'sug': case 'chip': $('#q').value = d.arg; addRecent(d.arg); renderSearch(); $('#q').focus(); break;
    case 'clearrecent': store.set('vela-recent', []); renderSearch(); break;
    case 'tab': state.listTab = d.arg; state.cat = null; render(); break;
    case 'cat': state.cat = d.arg; render(); window.scrollTo(0, 0); break;
    case 'backcat': state.cat = null; render(); break;
    case 'demo': closePops(); toast('Recurso de demonstração'); break;
    default: catalogAction(d.act, d, t);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') renderSearch();

  else if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !modalOpen()) { e.preventDefault(); openSearch(); }

setInterval(() => { if (state.view === 'ao-vivo' && !modalOpen() && !document.querySelector('#livestage video')) { const y = scrollY; render(); scrollTo(0, y); } }, 60000);

/* ============ Catálogo compartilhado (db) ============ */
/* Na página publicada, o catálogo vive no banco do artefato: todos leem ao vivo e só o dono grava (regra do banco).
   Sem banco (arquivo baixado, visitante sem login), continua valendo o catálogo salvo neste navegador. */
let MODE = 'local', DBH = null, ASSETS = null, syncing = false, again = false, syncT = 0;
const known = { items: new Map(), channels: new Map(), meta: '' };
const S = { items: new Map(), channels: new Map(), meta: null };
const clone = x => JSON.parse(JSON.stringify(x));
const idn = id => parseInt(String(id).replace(/\D/g, ''), 10) || 0;
const canon = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.fromEntries(Object.keys(x).sort().map(y => [y, x[y]])) : x);
function applyShared() {
  if (S.meta) {
    DATA = [...S.items.values()].map(clone).sort((a, b) => a.id - b.id);
    CH = [...S.channels.values()].map(clone).sort((a, b) => idn(a.id) - idn(b.id));
    GENRES = [...(S.meta.genres || [])];
    known.items = new Map([...S.items].map(([k, v]) => [k, canon(v)]));
    known.channels = new Map([...S.channels].map(([k, v]) => [k, canon(v)]));
    known.meta = canon(S.meta);
  } else {
    DATA = clone(BASE_ITEMS); CH = clone(BASE_CH); GENRES = [...BASE_GENRES];
    known.items = new Map(); known.channels = new Map(); known.meta = '';
  }
  reindex(); refresh(); renderNotifPanel();
}
async function initShared() {
  if (!window.claude || !window.claude.use) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) {}
  if (!db) return;
  try { ASSETS = await window.claude.use('assets'); } catch (e) { ASSETS = null; }
  DBH = db; MODE = 'shared';
  const got = { i: false, c: false, m: false };
  const maybe = () => { if (got.i && got.c && got.m) applyShared(); };
  const quiet = () => {};
  db.collection('items').onSnapshot(sn => { S.items = new Map(sn.docs.map(d => [d.id, d.data()])); got.i = true; maybe(); }, quiet);
  db.collection('channels').onSnapshot(sn => { S.channels = new Map(sn.docs.map(d => [d.id, d.data()])); got.c = true; maybe(); }, quiet);
  db.doc('meta/catalog').onSnapshot(sn => { S.meta = sn.exists ? sn.data() : null; got.m = true; maybe(); }, quiet);
}
function queueSync() { clearTimeout(syncT); syncT = setTimeout(syncShared, 250); }
async function syncShared() {
  if (syncing) { again = true; return; }
  syncing = true;
  let err = null;
  try {
    const ops = [];
    const plan = (col, list, map) => {
      const cur = new Map(list.map(d => [String(d.id), canon(d)]));
      cur.forEach((j, id) => { if (map.get(id) !== j) ops.push(async () => { await DBH.doc(col + '/' + id).set(JSON.parse(j)); map.set(id, j); }); });
      [...map.keys()].forEach(id => { if (!cur.has(id)) ops.push(async () => { await DBH.doc(col + '/' + id).delete(); map.delete(id); }); });
    };
    plan('items', DATA, known.items);
    plan('channels', CH, known.channels);
    let i = 0;
    const worker = async () => { while (i < ops.length) { const f = ops[i++]; try { await f(); } catch (e) { err = err || e; } } };
    await Promise.all([worker(), worker(), worker()]);
    const metaJ = canon({ seeded: true, genres: GENRES });
    if (!err && known.meta !== metaJ) { try { await DBH.doc('meta/catalog').set(JSON.parse(metaJ)); known.meta = metaJ; } catch (e) { err = e; } }
  } finally { syncing = false; }
  if (err) {
    const c = err && err.code;
    toast(c === 'invalid_argument' ? 'Sem permissão para salvar para todos. Abra a página com a conta dona.' : c === 'quota_exceeded' ? 'O limite de armazenamento do catálogo foi atingido.' : 'Não foi possível salvar para todos agora. Tente de novo.');
  }
  if (again) { again = false; queueSync(); }
}
function dropAssets(t) {
  if (MODE === 'shared' && ASSETS) [t.imgId, t.vid].filter(Boolean).forEach(id => ASSETS.delete(id).catch(() => {}));
}
async function persistMediaShared(t, vf) {
  const drop = id => { if (id && ASSETS) ASSETS.delete(id).catch(() => {}); };
  try {
    if (ASSETS && ed.imgBlob) { const r = await ASSETS.upload(ed.imgBlob, { type: 'image/jpeg' }); drop(t.imgId); t.imgId = r.id; t.img = ''; }
    else if (ASSETS && isAssetUrl(ed.img)) { t.imgId = assetIdOf(ed.img); t.img = ''; }
    else if (!ed.img) { drop(t.imgId); t.imgId = ''; }
    if (vf) {
      if (!ASSETS) toast('Enviar vídeo não está disponível agora.');
      else if (vf.size > MAX_MB * 1048576) toast('O vídeo passa de ' + MAX_MB + ' MB, o limite de envio. Para vídeos grandes, hospede o arquivo e cole o link.');
      else { const r = await ASSETS.upload(vf, { type: vf.type || 'video/mp4' }); drop(t.vid); t.vid = r.id; t.vname = vf.name; }
    } else if (ed.rmVideo) { drop(t.vid); t.vid = ''; t.vname = ''; }
  } catch (e) { toast('Não foi possível enviar o arquivo (' + ((e && e.code) || 'erro') + ').'); }
}
async function importLocal() {
  const s = store.get(CAT_KEY, null);
  if (!s || !Array.isArray(s.items)) return toast('Não há catálogo salvo neste navegador.');
  DATA = clone(s.items); CH = clone(s.channels || []); GENRES = [...(s.genres || [])];
  let skipped = 0;
  for (const [t, isC] of [...DATA.map(d => [d, false]), ...CH.map(c => [c, true])]) {
    if (!t.hasVideo) continue;
    const b = await vdb.get(vkey(isC, t.id));
    if (b && ASSETS && b.size <= MAX_MB * 1048576) { try { const r = await ASSETS.upload(b, { type: b.type || 'video/mp4' }); t.vid = r.id; } catch (e) { skipped++; } }
    else skipped++;
    t.hasVideo = false;
  }
  saveCatalog(); refresh();
  toast(skipped ? 'Catálogo importado. ' + skipped + ' vídeo(s) não couberam e ficaram de fora.' : 'Catálogo importado e salvo para todos.');
}

/* ============ Acesso restrito: botão + senha ============ */
/* O botão abre a tela de senha no navegador. Como este projeto é um HTML
   executado no Chrome, o controle de acesso é feito pelo PIN. Não é uma
   proteção forte contra alguém que tenha acesso ao código-fonte do site. */
let IS_ID = false, UNLOCKED = false, IS_OWNER = false, pinFails = 0, pinLockUntil = 0, lastGesture = 0;
const cyrb53 = (str, seed = 0) => {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
};
const PIN_HASH = 6332727697616820;
function syncAccess() {
  const was = IS_OWNER;
  IS_OWNER = IS_ID && UNLOCKED;
  document.querySelectorAll('[data-owner]').forEach(el => { el.hidden = !IS_OWNER; });
  if (was !== IS_OWNER) render();
}
async function initOwner() {
  // Em páginas HTML abertas no Chrome não existe a identificação de dono
  // usada pelo ambiente de pré-visualização. O PIN continua sendo exigido.
  IS_ID = true;
  syncAccess();
}
function openGate() {
  if (!IS_ID) return;
  if (UNLOCKED) { if (location.hash === '#gerenciar') render(); else location.hash = 'gerenciar'; return; }
  if (!$('#pin').hidden) return;
  lastFocus = document.activeElement;
  $('#pin-input').value = ''; $('#pin-err').textContent = '';
  $('#pin').hidden = false; syncLock(); $('#pin-input').focus();
}
function closeGate() {
  if ($('#pin').hidden) return;
  $('#pin').hidden = true; syncLock();
  if (lastFocus && document.contains(lastFocus) && lastFocus.focus) lastFocus.focus();
}
function checkPin() {
  const inp = $('#pin-input'), err = $('#pin-err');
  if (Date.now() < pinLockUntil) { err.textContent = 'Muitas tentativas. Aguarde alguns segundos.'; inp.value = ''; return; }
  if (cyrb53('vela-play:' + inp.value.trim()) === PIN_HASH) {
    pinFails = 0; UNLOCKED = true; closeGate(); syncAccess();
    if (location.hash === '#gerenciar') render(); else location.hash = 'gerenciar';
  } else {
    pinFails++;
    if (pinFails >= 3) { pinFails = 0; pinLockUntil = Date.now() + 30000; err.textContent = 'Senha incorreta. Aguarde 30 segundos.'; }
    else err.textContent = 'Senha incorreta.';
    inp.value = ''; inp.focus();
  }
}
$('#admin-access').addEventListener('click', openGate);
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && e.key === '3') { e.preventDefault(); openGate(); }
  else if (e.key === 'Escape') closeGate();
});
document.addEventListener('submit', e => { if (e.target.id === 'pin-form') { e.preventDefault(); checkPin(); } });
document.addEventListener('click', e => { if (e.target.closest('[data-pin]') || e.target.id === 'pin') closeGate(); });
syncAccess();
initOwner();
initShared();

route();
</script>
